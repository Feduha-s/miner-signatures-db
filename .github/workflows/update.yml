name: Auto Update Signatures Database

on:
  schedule:
    # Запуск каждый день в 03:00 UTC (06:00 МСК)
    - cron: '0 3 * * *'
  workflow_dispatch: # Запуск вручную

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Builder Script
        run: python build_signatures.py

      - name: Commit and Push signatures.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update signatures database"
          file_pattern: "signatures.json"
